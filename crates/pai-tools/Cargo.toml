[package]
name = "pai-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "First-class tool protocol: declared schemas, permissions, risk levels. Includes safe built-ins (calculator, memory)."

[dependencies]
pai-core.workspace = true
pai-permissions.workspace = true
pai-memory.workspace = true
pai-documents.workspace = true
pai-connector-email.workspace = true
pai-connector-gitlab.workspace = true
pai-inference.workspace = true
pai-vision.workspace = true
pai-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
