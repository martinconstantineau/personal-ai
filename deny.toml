# cargo-deny policy — dependency supply-chain gate for a local-first,
# privacy-sensitive application.
#
#   cargo deny check            # all sections
#
# Runs in CI (.github/workflows/ci.yml → deny job).

[advisories]
# Vulnerability advisories are unconditional errors; yanked crates denied.
# `unmaintained`/`unsound` take a detection scope — flag direct deps.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Copyleft-free, permissive licenses compatible with our Apache-2.0/MIT
# dual licensing and with binary redistribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",            # ring's legacy terms
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle)
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []

[sources]
# crates.io only — no git/path dependencies pulled into the tree.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
