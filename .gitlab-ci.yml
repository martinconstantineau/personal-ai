# Personal AI — mirrors the GitHub workflow: Rust lint+test, FFI
# build, then Flutter analyze + test. The widget test spawns the real
# bridge isolate, so libpai_ffi must exist at ../../target/debug
# relative to apps/desktop.
stages:
  - lint
  - build
  - test
  - release

variables:
  # Pinned to the local toolchain — pubspec requires Dart ^3.13.3 and
  # the cirruslabs/flutter images stopped at Flutter 3.44 (Dart 3.12).
  FLUTTER_VERSION: "3.47.4"

# Installs the pinned Flutter SDK. Used by jobs whose base image has
# no Flutter (kept version-matched with AGENTS.md).
.flutter-setup: &flutter-setup
  - apt-get update -qq && apt-get install -y -qq git curl unzip xz-utils file libglu1-mesa
  - git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git /opt/flutter
  - export PATH="/opt/flutter/bin:$PATH"
  - flutter config --no-analytics
  - flutter --version

# keyring builds the Secret Service dbus client on Linux; cpal
# (pai-voice mic) builds alsa-sys. Both need system headers.
rust:
  stage: lint
  image: rust:latest
  script:
    - apt-get update -qq && apt-get install -y -qq libdbus-1-dev libasound2-dev pkg-config libssl-dev gcc
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

ffi:
  stage: build
  image: rust:latest
  script:
    - apt-get update -qq && apt-get install -y -qq libdbus-1-dev libasound2-dev pkg-config libssl-dev gcc
    - cargo build -p pai-ffi
  artifacts:
    paths:
      - target/debug/libpai_ffi.so
    expire_in: 1 hour

# rust:latest base so libpai_ffi.so (from the ffi job, built on the
# same image) resolves the same glibc; Flutter is installed pinned.
desktop:
  stage: test
  image: rust:latest
  dependencies:
    - ffi
  script:
    - *flutter-setup
    - cd apps/desktop
    - flutter pub get
    - flutter analyze
    - flutter test

# Tag-triggered packaging. Shared runners are Linux, so this produces
# the Linux desktop bundle (Flutter linux + libpai_ffi.so in the
# bundle's lib/ — the app's first search path). The Windows zip is
# built and published by the GitHub mirror workflow.
package:linux:
  stage: release
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *flutter-setup
    - apt-get install -y -qq libdbus-1-dev libasound2-dev libssl-dev pkg-config clang cmake ninja-build libgtk-3-dev liblzma-dev g++
    - cargo build -p pai-ffi --release
    - cd apps/desktop
    - flutter pub get
    - flutter build linux --release
    - cp ../../target/release/libpai_ffi.so build/linux/x64/release/bundle/lib/
    - tar -czf ../../pai-app-linux-x64.tar.gz -C build/linux/x64/release bundle
  artifacts:
    paths:
      - pai-app-linux-x64.tar.gz

# release-cli needs its own image; the release links at the package
# job's artifact URL.
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - package:linux
  script:
    - echo "publishing release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Personal AI $CI_COMMIT_TAG"
    description: "Linux desktop bundle. The Windows zip is attached to the matching release on the GitHub mirror."
    assets:
      links:
        - name: pai-app-linux-x64.tar.gz
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/pai-app-linux-x64.tar.gz?job=package:linux"
          link_type: package
