name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # keyring's Linux Secret Service backend is a dbus client;
      # cpal (pai-voice mic) builds alsa-sys and needs the headers.
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    # audit-check publishes its result as a check run.
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses bans sources

  # The widget test spawns the real bridge isolate — it needs
  # libpai_ffi at ../../target/debug relative to apps/desktop.
  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # pai-identity's keyring builds the Secret Service dbus client
      # on Linux — same dep the rust job installs; cpal needs alsa.
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pai-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: pai-ffi
          path: target/debug/libpai_ffi.so

  flutter:
    needs: ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: pai-ffi
          path: target/debug
      - name: analyze + test
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cargo build -p pai-ffi --release
      - working-directory: apps/desktop
        run: |
          flutter pub get
          flutter build windows --release
          cp ../../target/release/pai_ffi.dll build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: pai-app-windows
          path: apps/desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
